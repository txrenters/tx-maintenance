# Install to /etc/systemd/system/mysql.service.d/preserve-runtime-dir.conf
# on the VPS, then: systemctl daemon-reload
#
# Keep /run/mysqld across mysqld restarts.
#
# By default systemd removes a unit's RuntimeDirectory= when the unit stops and
# recreates it on start, giving the directory a NEW INODE each time. Containers
# that bind-mount /var/run/mysqld keep the old, orphaned, empty directory and
# get "SQLSTATE[HY000] [2002] No such file or directory" -- while still passing
# any healthcheck that does not touch the database.
#
# That is what happened on 2026-09-24 06:47, when unattended-upgrades restarted
# mysqld: the whole site returned 500 for 41 hours behind four green containers.
#
# Verified on tx-chatbot's host, and again on tx-maintenance's (2.25.245.30,
# 2026-09-25): with Preserve=no a stop/start or restart changed the inode; with
# Preserve=yes it did not. After installing, `systemctl restart mysql` kept
# /run/mysqld at the same inode on the host and in the containers; the app
# errored for ~4s and recovered with no container recreated.
#
# Lives under /etc/systemd/system (not the packaged unit in /usr/lib) so a
# mysql-server package upgrade cannot silently revert it.
[Service]
RuntimeDirectoryPreserve=yes
