name: pull request

# Runs before a merge, which here is also a deploy: the deploy workflow only
# fires on a push to the default branch. Nothing in this file deploys.
on:
  pull_request:

# A new push to the same PR supersedes the run in flight. Deliberately not the
# deploy group, so a PR check never queues behind or holds up a rollout.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          # The extension list the Azure build already used.
          extensions: mbstring, bcmath, pdo, pdo_mysql, curl, gd, xml, zip, soap, redis, pcntl, posix, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Feature tests render Inertia pages, which resolve assets through the
      # Vite manifest; without a build they fail on a missing manifest.
      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # The suite runs on sqlite, as .env.example and every local run do:
      # phpunit.xml names the tracked txrenter_test file as the database and
      # RefreshDatabase rebuilds it. Part of the suite only passes on sqlite
      # (MySQL strict mode rejects the fixture values some tests rely on), so
      # a MySQL service here would fail the check on tests, not on the code.
      - name: Run tests
        env:
          DB_CONNECTION: sqlite
        run: php -d memory_limit=1G artisan test

  # The Dockerfile installs Node through NodeSource rather than setup-node, so
  # the job above never exercises it. Building the image is the only check that
  # the production toolchain still installs and runs the asset build.
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Both runtime targets, explicitly: a plain build stops at the last stage
      # and skips any stage it does not copy from.
      - name: Build the app image
        run: docker build --pull --target app .

      - name: Build the web image
        run: docker build --target web .
