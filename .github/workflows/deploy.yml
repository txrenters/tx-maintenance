name: Build and deploy Laravel app to Azure Web App - txrenters

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  COMPOSER_PROCESS_TIMEOUT: 300
  NODE_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Cache optimization
      - name: Cache Composer
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo, pdo_mysql, curl, gd, xml, zip, soap
          coverage: none

      - name: Install Composer Dependencies
        if: steps.cache-composer.outputs.cache-hit != 'true'
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction
          composer dump-autoload --optimize

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --no-progress

      - name: Build frontend assets
        run: npm run build --if-present

      - name: Optimize Laravel Application
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Zip the Application for Deployment
        run: |
          zip -r release.zip ./* -x '*.git*' '*.env*' '*.idea*' 'tests/*' 'node_modules/*'

      - name: Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "txrenters"
          # Removed slot-name parameter completely since you're deploying to production
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
