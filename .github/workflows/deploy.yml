name: Build and Deploy Laravel + Vite to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_ENV: production
  COMPOSER_NO_INTERACTION: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔧 Cache Composer dependencies
      - name: Cache Composer
        id: cache-composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # 🔧 Cache NPM dependencies
      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ⚙️ PHP Setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_mysql, curl, gd, xml, zip
          coverage: none

      # 📦 Composer Install
      - name: Install PHP dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          composer dump-autoload --optimize

      # 🧱 Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # 📥 Install and Build Frontend (Vite)
      - name: Install and Build Frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      # ✅ Confirm Vite Build Output Exists
      - name: Check Vite build output
        run: |
          if [ ! -d "public/build" ]; then
            echo "❌ Vite build failed or output missing (public/build)";
            exit 1;
          fi

      # ⚡ Laravel Optimization
      - name: Laravel Optimize
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # 📦 Create deployment package
      - name: Package for Azure Deployment
        run: |
          zip -r release.zip . \
            -x ".git/*" "node_modules/*" "tests/*" \
            ".env*" "storage/framework/cache/*" \
            "*.gitignore" "*.editorconfig"

      # 📤 Upload package as artifact
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: release.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      # 🚀 Deploy to Azure Web App
      - name: Azure Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: "your-app-name" # 🔁 Replace this
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip
