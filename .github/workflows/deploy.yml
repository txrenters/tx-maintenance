name: Build and deploy Laravel app to Azure Web App - txrenters

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, pdo, pdo_mysql, curl, gd, xml, zip, soap, redis, pcntl, posix

      - name: Install Image Optimization Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jpegoptim optipng pngquant gifsicle webp libavif-bin

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rename .env file
        run: |
          mv .env.example .env
          echo "REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}" >> .env
          echo "REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}" >> .env
          echo "REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}" >> .env
          echo "REVERB_HOST=${{ secrets.REVERB_HOST }}" >> .env
          echo "REVERB_PORT=${{ secrets.REVERB_PORT }}" >> .env
          echo "REVERB_SCHEME=${{ secrets.REVERB_SCHEME }}" >> .env

          echo "VITE_APP_NAME='TexasRenters.com Maintenance'" >> .env

          echo "MYSQL_ATTR_SSL_CA=/etc/ssl/certs/ca-certificates.crt" >> .env

          echo "VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY }}" >> .env
          echo "VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST }}" >> .env
          echo "VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT }}" >> .env
          echo "VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME }}" >> .env

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Optimize Laravel Application
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize

      - name: Set Permissions for Storage and Cache
        run: |
          chmod -R 775 storage bootstrap/cache
          chmod -R 777 storage/logs

      - name: Delete Old Artifacts
        uses: actions/github-script@v6
        id: artifact
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            res.data.artifacts
              .forEach(({ id }) => {
                github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: id,
                })
              })

      # 📦 Create deployment package
      - name: Package for Azure Deployment
        run: |
          zip -r release.zip . \
            -x ".git/*" "node_modules/*" "tests/*" \
            ".env*" "*.gitignore" "*.editorconfig"

      - name: Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Wait before deploying to Azure
        run: sleep 40 # Wait for 40 seconds to avoid SCM conflicts

      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      # Azure runs /home/startup.sh on container start (it is what runs
      # "php artisan migrate --force" on every deploy), but the zip deploy can
      # only write /home/site/wwwroot — so the server copy silently drifts from
      # the repo. Sync it here via the Kudu VFS API, backing up the existing
      # copy first, so the startup script Azure executes is always the one in
      # git and migrations never need a manual run after deploy.
      - name: Sync startup.sh to /home (with backup)
        run: |
          CREDS='${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}'
          USER=$(echo "$CREDS" | grep -oP 'userName="\K[^"]+' | head -1)
          PASS=$(echo "$CREDS" | grep -oP 'userPWD="\K[^"]+' | head -1)
          KUDU="https://txrenters.scm.azurewebsites.net/api/vfs"

          unzip -o -p release.zip startup.sh > startup.sh

          # Back up whatever is on the server now (404 on first run is fine).
          curl -sf -u "$USER:$PASS" "$KUDU/startup.sh" -o current-startup.sh \
            && curl -sf -u "$USER:$PASS" -X PUT --data-binary @current-startup.sh \
                 -H "If-Match: *" "$KUDU/startup.sh.bak" \
            || echo "No existing /home/startup.sh to back up"

          # Skip the upload when the server already matches the repo.
          if cmp -s startup.sh current-startup.sh; then
            echo "/home/startup.sh already up to date"
          else
            curl -sf -u "$USER:$PASS" -X PUT --data-binary @startup.sh \
              -H "If-Match: *" "$KUDU/startup.sh"
            echo "/home/startup.sh updated from repo"
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "txrenters"
          slot-name: "Production"
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
