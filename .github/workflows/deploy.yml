name: Build and deploy Laravel app to Azure Web App - txrenters

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Runs queue one at a time. The build job deletes ALL repo artifacts, so two
# overlapping runs raced: the newer run's cleanup deleted the older run's
# release.zip before its deploy job could download it (Artifact not found).
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # intl backs Number::currency() on the invoices page, which throws
          # without it. The Azure runtime already has it; listing it here keeps
          # the build box able to run anything that formats money.
          extensions: mbstring, bcmath, pdo, pdo_mysql, curl, gd, xml, zip, soap, redis, pcntl, posix, intl

      - name: Install Image Optimization Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jpegoptim optipng pngquant gifsicle webp libavif-bin

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rename .env file
        run: |
          mv .env.example .env
          echo "REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}" >> .env
          echo "REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}" >> .env
          echo "REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}" >> .env
          echo "REVERB_HOST=${{ secrets.REVERB_HOST }}" >> .env
          echo "REVERB_PORT=${{ secrets.REVERB_PORT }}" >> .env
          echo "REVERB_SCHEME=${{ secrets.REVERB_SCHEME }}" >> .env

          echo "VITE_APP_NAME='TexasRenters.com Maintenance'" >> .env

          echo "MYSQL_ATTR_SSL_CA=/etc/ssl/certs/ca-certificates.crt" >> .env

          echo "VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY }}" >> .env
          echo "VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST }}" >> .env
          echo "VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT }}" >> .env
          echo "VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME }}" >> .env

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Never ship caches baked from the CI .env (a renamed .env.example with
      # APP_ENV=local, sqlite, and empty credentials). A deploy whose boot-time
      # re-cache raced or failed would serve that poisoned config in production
      # — no DB, no integrations, 500s on every authenticated page. Shipping no
      # caches means the app always boots from Azure's real App Settings.
      # (Plain rm, not `artisan optimize:clear` — that boots the app and hits
      # the cache store, which the CI environment doesn't have.)
      - name: Clear Cached Bootstrap Files
        run: rm -f bootstrap/cache/*.php

      - name: Set Permissions for Storage and Cache
        run: |
          chmod -R 775 storage bootstrap/cache
          chmod -R 777 storage/logs

      - name: Delete Old Artifacts
        uses: actions/github-script@v6
        id: artifact
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            res.data.artifacts
              .forEach(({ id }) => {
                github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: id,
                })
              })

      # 📦 Create deployment package
      - name: Package for Azure Deployment
        run: |
          zip -r release.zip . \
            -x ".git/*" "node_modules/*" "tests/*" \
            ".env*" "*.gitignore" "*.editorconfig"

      - name: Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Wait before deploying to Azure
        run: sleep 40 # Wait for 40 seconds to avoid SCM conflicts

      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "txrenters"
          slot-name: "Production"
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
