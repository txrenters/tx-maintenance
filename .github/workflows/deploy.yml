name: Build and Deploy Laravel to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_ENV: production
  COMPOSER_NO_INTERACTION: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache PHP dependencies
      - name: Cache Composer
        id: cache-composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # Cache Node modules (improved version)
      - name: Cache npm dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # PHP Setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_mysql, curl, gd, xml, zip
          coverage: none

      # Install Composer dependencies
      - name: Install Composer dependencies
        if: steps.cache-composer.outputs.cache-hit != 'true'
        run: |
          composer install --no-dev --optimize-autoloader --no-progress
          composer dump-autoload --optimize

      # Node.js Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

        # Install dependencies
      - name: Install npm dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-progress
          npm install vite --no-audit --no-progress  # Explicitly install Vite

      # Build assets
      - name: Build frontend assets
        run: npm run build --if-present

      # Laravel optimization
      - name: Optimize application
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # Create deployment package
      - name: Create deployment package
        run: |
          zip -r release.zip . \
            -x '.git/*' '.env*' 'node_modules/*' \
            'storage/framework/cache/*' 'storage/logs/*' \
            'tests/*' '*.editorconfig' '*.gitignore'

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: release.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - uses: azure/webapps-deploy@v3
        with:
          app-name: "your-app-name"
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
