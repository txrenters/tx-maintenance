; PHP Configuration for TX Work Order
; This file sets upload limits for the application

; Maximum file upload size (50MB)
upload_max_filesize = 50M

; Maximum POST data size (must be >= upload_max_filesize)
; Set higher to allow multiple files
post_max_size = 200M

; Maximum execution time for uploads (5 minutes)
max_execution_time = 300

; Maximum input processing time (5 minutes)
max_input_time = 300

; Memory limit
memory_limit = 512M
