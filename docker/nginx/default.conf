# nginx inside the stack. The host's nginx terminates TLS and proxies here over
# loopback, so this is plain HTTP.
#
# No real_ip_header here: client IP resolution belongs to Laravel's
# trustProxies, which also honours X-Forwarded-Proto.

# Docker's embedded DNS. Upstreams are passed through variables below so they
# are resolved per request: during a rolling deploy the old container's IP
# disappears, and a hostname cached at startup would keep pointing at it.
# bin/deploy.sh waits out this TTL before retiring old containers.
resolver 127.0.0.11 valid=2s ipv6=off;

# No nginx version in the Server header or on nginx's own error pages.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Keep in step with post_max_size in docker/php/php.ini.
    client_max_body_size 200M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb: the browser connects to the page's own host (see
    # resources/js/echo.js), so WebSocket traffic arrives here and is handed
    # to the reverb container.
    location ~ ^/(app|apps)(/|$) {
        set $upstream_reverb reverb:8080;
        proxy_pass http://$upstream_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite emits content-hashed filenames, so these can never go stale. A name
    # this build no longer has is looked up in the asset history, so a tab
    # opened before a deploy can still load the chunks it was built against.
    location ~ ^/build/assets/(?<built_asset>[^/]+)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /build/assets/$built_asset /build-history/assets/$built_asset =404;
    }

    # A plain prefix, not ^~: ^~ would stop nginx from trying the regex above.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Only reachable through the fallback above.
    location ^~ /build-history/ {
        internal;
    }

    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        # expose_php = Off already drops it; this holds if that ever regresses.
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Bulk uploads, PDF generation and AI reviews can take a while; matches
        # max_execution_time in docker/php/php.ini.
        fastcgi_read_timeout 300s;
    }

    # FPM's own endpoints must not be reachable from outside the container.
    location ~ ^/(ping|fpm-status)$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
