; Production PHP settings.

; Onboarding, W-9 and invoice PDFs render through dompdf, which needs considerably
; more than the 128M default.
memory_limit = 512M

; Same limits as public/.user.ini on Azure. Keep post_max_size in step with
; client_max_body_size in docker/nginx.
upload_max_filesize = 50M
post_max_size = 200M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300

expose_php = Off
date.timezone = UTC

; Errors go to the container log, never to the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code only changes when a new image is deployed, so never stat files for
; changes. Only safe because the application tree is immutable in the image.
opcache.validate_timestamps = 0
