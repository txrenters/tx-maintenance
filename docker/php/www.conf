; PHP-FPM pool tuning for a containerised app.
;
; Loaded after the image's default www.conf, so these values win.
[www]
; The container runs as www-data already; declaring user/group here would make
; FPM warn that it cannot change identity as a non-root process.
listen = 9000

; /ping and /fpm-status are useful when debugging a
; wedged pool. Neither is reachable through nginx -- only over the FastCGI
; socket on the internal network.
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

; `dynamic` suits a VPS hosting several apps: idle apps release workers instead
; of holding a fixed pool each. Raise pm.max_children per app only if
; `docker compose logs app | grep "server reached"` shows saturation.
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycles workers periodically so a slow leak cannot accumulate indefinitely.
pm.max_requests = 500

; Surface worker output in `docker compose logs` rather than a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no
